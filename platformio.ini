[env:waveshare_rp2350_tiny]
; Pin the platform (including its Arduino-Pico framework and toolchain) and libraries.
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#24f5f5b668907cddae741529a40d344de5a5cf19
board = rpipico2
framework = arduino
board_build.core = earlephilhower
lib_deps =
    adafruit/Adafruit NeoPixel@1.15.5
    https://github.com/boschsensortec/BMP5_SensorAPI.git#3bd7c260419e4d08d7fa28343f27e0e6dd276411
    https://github.com/STMicroelectronics/lsm6dsv32x-pid.git#c7d147a1ef21da8e43b5a64b1479d05fda015712
monitor_speed = 115200
monitor_filters = send_on_enter
; Select one entry point, as in recovery_system_avionics.
build_flags = -D MAIN
; Bench testing only, never for flight: adds `imu identity`, which forgets the IMU calibration and
; a revoked identity (after a failed verification), and `nav gyro start` (gyroscope-only attitude
; while armed in PAD). Uncomment by removing only the ';'.
;   -D IMU_IDENTITY_TEST
;build_flags = -D SMOKE_TEST
;build_flags = -D SENSOR_TEST
;build_flags = -D BLUETOOTH_TEST
;build_flags = -D BLUETOOTH_NAME_TEST
;build_flags = -D FLASH_TEST
;build_flags = -D FLASH_DIRECTORY_TEST
;build_flags = -D CONFIG_STORE_TEST
