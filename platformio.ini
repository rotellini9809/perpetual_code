[env:waveshare_rp2350_tiny]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
framework = arduino
board_build.core = earlephilhower
lib_deps =
	adafruit/Adafruit NeoPixel@^1.15.2
    https://github.com/boschsensortec/BMP5_SensorAPI.git
    https://github.com/STMicroelectronics/lsm6dsv32x-pid.git#v4.1.1
monitor_speed = 115200
monitor_filters = send_on_enter
; Select one entry point, as in recovery_system_avionics.
build_flags = -D MAIN
;build_flags = -D SMOKE_TEST
;build_flags = -D SENSOR_TEST
;build_flags = -D BLUETOOTH_TEST
;build_flags = -D BLUETOOTH_NAME_TEST
;build_flags = -D FLASH_TEST
;build_flags = -D FLASH_DIRECTORY_TEST
;build_flags = -D CONFIG_STORE_TEST
